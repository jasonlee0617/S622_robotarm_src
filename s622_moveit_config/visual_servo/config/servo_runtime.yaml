/**:
  ros__parameters:
    # Servo entry strategy:
    # - direct_from_home: start visual servo from HOME/recovery pose.
    # - target_above_first: global-plan to target_above before servo.
    # servo_entry_mode: direct_from_home
    servo_entry_mode: target_above_first
    servo_ns: /servo_node
    servo_controller_type: LADRC #可选值：PID、PD、PI_FF、ADAPTIVE_PID、LADRC、MPC
    
    servo_align_xy_tol: 0.001
    servo_grasp_z_tol: 0.003

    servo_status_decel_codes: [1, 6]
    servo_status_halt_codes: [2, 4, 5]

    # Velocity / acceleration caps
    v_xy_max: 3.2
    a_xy_max: 0.60
    v_z_max: 0.08
    a_z_max: 3.2
    twist_norm_max: 0.10
    status1_speed_scale: 0.40

    # Prediction / feedforward
    predict_lead_sec: 0.025
    max_predict_horizon: 0.12
    servo_detection_timeout: 0.14
    cmd_lpf_alpha: 0.70
    vel_ff_gain: 0.9
    rel_vel_damping_gain: 1.20
    ff_vel_ema_alpha: 0.65
    max_target_speed: 0.06
    target_vxy_clip: 0.06
    meas_jump_clip_xy: 0.004
    ee_vel_ema_alpha: 0.70
    rel_vel_clip: 0.06
    ff_term_clip: 0.05
    target_accel_ema_alpha: 0.25
    
    aligned_stable_count: 80
    handoff_target_delta_max: 0.01

    # Servo -> global motion handoff
    servo_handoff_zero_twist_count: 5
    servo_handoff_zero_twist_dt: 0.005
    servo_handoff_ee_speed_tol: 0.003
    servo_handoff_joint_speed_tol: 0.01
    servo_handoff_stable_sec: 0.04
    servo_handoff_timeout_sec: 0.25

    # FF scaling gates
    ff_age_start_sec: 0.08
    ff_age_ref_sec: 0.09
    ff_age_window_sec: 0.05
    ff_age_floor_scale: 0.70
    ff_err_norm_threshold: 0.0065
    ff_large_err_scale: 0.60

    # Slew/post-filter blending
    slew_dv_trigger: 0.03
    slew_alpha_high: 1.00
    slew_alpha_low: 0.70

    # LADRC controller tuning
    ladrc_wc_xy: 10.0
    ladrc_wo_xy: 25.0
    ladrc_b0_xy: 0.5
    ladrc_wc_z: 4.0
    ladrc_wo_z: 15.0
    ladrc_b0_z: 1.0
    ladrc_ff_mix_gain: 0.20

    # MPC controller tuning
    mpc_ts: 0.005
    mpc_horizon: 32
    mpc_tau: 0.015
    mpc_delay_sec: 0.015
    mpc_delay_steps: 4
    mpc_q_e: 160.0
    mpc_q_v: 10.0
    mpc_q_terminal: 200.0
    mpc_r_u: 0.8
    mpc_r_du: 12.0
    mpc_u_max: 0.20
    mpc_du_max: 0.0045
    mpc_norm_clip: 0.20

    # PID-family tuning used by PID, PD, PI_FF and ADAPTIVE_PID modes
    pid_kp_xy: 10.0
    pid_ki_xy: 20.0
    pid_kd_xy: 0.0
    pid_kp_z: 0.0
    pid_ki_z: 0.0
    pid_kd_z: 0.0
    pid_d_ema_alpha: 0.8
    pid_derivative_clip_xy: 1.0
    pid_derivative_clip_z: 1.0
    pid_integral_limit_xy: 0.005
    pid_integral_active_radius: 0.005
    pid_integral_decay: 0.97
    pid_u_xy_max: 0.22

    # Adaptive PID tuning used when servo_controller_type=ADAPTIVE_PID
    adaptive_pid_kp_xy: 50.0
    adaptive_pid_ki_xy: 0.0
    adaptive_pid_kd_xy: 10.0
    adaptive_pid_ki_z: 20.0
    adaptive_pid_schedule_alpha: 0.8
    adaptive_pid_kp_xy_min: 9.0
    adaptive_pid_kp_xy_max: 9.0
    adaptive_pid_kp_z_min: 1.5
    adaptive_pid_kp_z_max: 3.2
    adaptive_pid_kd_xy_min: 0.0
    adaptive_pid_kd_xy_max: 0.0
    adaptive_pid_kd_z_min: 0.04
    adaptive_pid_kd_z_max: 0.12
    adaptive_pid_err_xy_low: 0.004
    adaptive_pid_err_xy_high: 0.025
    adaptive_pid_err_z_low: 0.0015
    adaptive_pid_err_z_high: 0.015
    adaptive_pid_derr_xy_low: 0.0001
    adaptive_pid_derr_xy_high: 0.006
    adaptive_pid_derr_z_low: 0.01
    adaptive_pid_derr_z_high: 0.1
