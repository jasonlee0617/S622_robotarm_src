auto_calibration_collector:
  ros__parameters:
    # Frames and ArUco observation.
    base_frame: base_link
    ee_frame: grasp_frame
    tracking_base_frame: camera_color_optical_frame
    tracking_marker_frame: calibration_aruco
    marker_id: 1
    marker_size_m: 0.070
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    aruco_dictionary_id: DICT_5X5_250

    # The root is sample 0. Every later target is root_T_ee * tool_delta.
    # This centers the locked camera optical axis above the fixed ArUco marker.
    original_place_xyz: [0.3150, 0.0325, 0.3506]
    original_place_rpy_deg: [0.0, 180.0, 90.0]
    workspace_min_xyz: [0.05, -0.35, 0.02]
    workspace_max_xyz: [0.55, 0.35, 0.60]

    # Keep the existing Fairino simulation defaults.  Real launch overrides
    # this client/pipeline without changing the root-relative action table.
    move_group_name: robot_arm
    move_group_ns_fairino: /move_group_fairino
    move_group_ns_kdl: /move_group_kdl
    ik_plugin: fairino
    planning_pipeline_id: fairino
    planner_id: "tube_birrt*"
    joint_names: [j1, j2, j3, j4, j5, j6]
    max_velocity: 0.15
    max_acceleration: 0.15
    allowed_planning_time: 8.0
    position_tolerance: 0.008
    orientation_tolerance: 0.0175
    allowed_start_tolerance: 0.05
    action_delay: 0.2
    num_candidate_plans: 8
    wrist_weight: 80.0
    settle_time: 1.2
    original_place_attempts: 3
    original_place_motion_timeout: 30.0
    original_place_retry_wait: 2.0
    candidate_motion_timeout: 30.0
    candidate_max_joint_excursion_rad: 0.45
    candidate_max_adjacent_joint_jump_rad: 0.10
    candidate_max_wrist_travel_rad: 0.55
    keyboard_poll_period: 0.1
    start_wait_poll_period: 0.1
    # 分步模式：每个标定动作执行前需在 CLI 按 Enter 才继续（q 可中断）。
    # 默认开启；非交互运行（launch/auto_collect）自动连续执行。需要连续模式可设 false。
    step_between_actions: true

    # Fixed 20-pose WVCSC-style run: root + 19 continuous actions.
    # Do not split this one pool into fitting and validation subsets.
    minimum_samples: 15
    minimum_solution_samples: 14
    # dx_m, dy_m, dz_m, rx_deg, ry_deg, rz_deg. All targets are evaluated
    # against the verified root; explicit ROS parameters can override this list.
    tool_delta_specs:
      - "-0.03,0.02,0.01,5.01,9.58,13.29"
      - "-0.04,0.03,0.02,9.58,15.82,16.57"
      - "-0.03,0.05,0.03,13.29,16.57,7.38"
      - "0.00,0.07,0.02,15.82,11.56,-7.38"
      - "0.04,0.06,0.00,16.95,2.53,-16.57"
      - "0.06,0.04,-0.01,16.57,-7.38,-13.29"
      - "0.07,0.02,0.00,14.72,-14.72,0.00"
      - "0.06,0.02,0.02,11.56,-16.95,13.29"
      - "0.04,0.01,0.03,7.38,-13.29,16.57"
      - "0.02,0.00,0.01,2.53,-5.01,7.38"
      - "-0.02,0.00,-0.01,-2.53,5.01,-7.38"
      - "-0.05,0.01,-0.02,-7.38,13.29,-16.57"
      - "-0.07,0.01,0.00,-11.56,16.95,-13.29"
      - "-0.07,-0.02,0.02,-14.72,14.72,0.00"
      - "-0.04,-0.05,0.02,-16.57,7.38,13.29"
      - "-0.01,-0.06,0.01,-16.95,-2.53,16.57"
      - "0.02,-0.07,0.00,-15.82,-11.56,7.38"
      - "0.03,-0.07,-0.01,-13.29,-16.57,-7.38"
      - "0.03,-0.06,-0.01,-9.58,-15.82,-16.57"

    # Per-sample quality gates, matching the strict WVCSC semantics.
    marker_recent_timeout: 1.5
    stable_observation_timeout: 4.0
    stable_frame_count: 10
    stable_min_valid_frames: 10
    min_marker_distance: 0.25
    max_marker_distance: 0.80
    min_visible_border_px: 60.0
    min_marker_side_px: 90.0
    pnp_reprojection_rms_max_px: 1.0
    pnp_reprojection_max_corner_px: 2.0
    ippe_ambiguity_abs_gap_px: 0.05
    ippe_ambiguity_max_ratio: 1.10
    # A temporally stable IPPE medoid remains acceptable in this fixed-marker
    # simulation; reprojection, pose-stability, timestamp-TF, and solve gates stay strict.
    ippe_min_non_ambiguous_frames: 0
    max_pnp_translation_mad_m: 0.0005
    max_pnp_rotation_mad_deg: 0.15
    max_joint_velocity_rad_s: 0.005
    max_ee_translation_drift_m: 0.0003
    max_ee_rotation_drift_deg: 0.05
    sample_min_translation_delta_m: 0.006
    sample_min_rotation_delta_deg: 3.0
    root_position_tolerance_m: 0.003
    root_orientation_tolerance_deg: 0.5

    # Park/Horaud are the hard consensus. Tsai-Lenz is diagnostic-only because
    # the locked 180-degree camera mount is singular for its parameterization.
    solver_translation_sigma_m: 0.0005
    solver_rotation_sigma_deg: 0.30
    max_algorithm_translation_delta_m: 0.003
    max_algorithm_rotation_delta_deg: 1.0
    max_marker_position_rms_m: 0.002
    max_marker_rotation_rms_deg: 0.7
    min_translation_span_m: 0.040
    min_rotation_span_deg: 20.0
    min_informative_rotation_pairs: 20
    min_rotation_axis_ratio: 0.20
    max_calibration_translation_norm_m: 0.30
    simulation_truth_translation_m: 0.003
    simulation_truth_rotation_deg: 1.0

    moveit_ready_timeout: 30.0
    moveit_ready_poll_interval: 0.2
    calibration_output_directory: $HOME/fairino_robotarm/src/calibration_ws/hand_eye_calibration/calib/sim
    calibration_file_prefix: robot_calibration
