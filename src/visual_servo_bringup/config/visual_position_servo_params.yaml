common:
  launch: {}
  nodes:
    visual_servo_grasping:
      task:
        preferred_target: cube
        target_priority:
        - cube
        - elongated_object
        - box
        - stone
        open_gripper_after_home: false
        action_delay: 0.5
        detection_timeout: 3.0
        num_candidate_plans: 5
        wrist_weight: 50.0
        wrist_joint_indices:
        - 2
        - 3
        - 4
      planning:
        camera_frame: camera_color_optical_frame
        arm_max_velocity: 0.2
        arm_max_acceleration: 0.2
        allowed_planning_time: 15.0
        position_tolerance: 0.005
        orientation_tolerance: 0.005
        allowed_start_tolerance: 0.1
        j2_constraint_position: -1.5708
        j2_constraint_tolerance: 1.5708
      runtime:
        servo_ns: /servo_node
        servo_qos_mode: modern
        servo_qos_cmd_reliability: reliable
        servo_qos_cmd_durability: volatile
        servo_qos_cmd_depth: 1
        servo_qos_status_reliability: reliable
        servo_qos_status_durability: volatile
        servo_qos_status_depth: 1
        servo_align_xyz_tol: 0.001
        servo_status_decel_codes:
        - 1
        - 6
        servo_status_halt_codes:
        - 2
        - 4
        - 5
        aligned_stable_count: 80
      perception:
        active_source: yolo_kalman    #yolo_kalman/aruco
        aruco:
          marker_id: 1
          marker_size_m: 0.07
          dictionary: DICT_5X5_250
          marker_pose_topic: /aruco_marker/pose
          visualization_image_topic: /aruco_marker/visualization
          visualization_marker_id: 1
          prediction_hold_sec: 0.25
          motion_auto_start_topic: /aruco_marker_auto_start
      moveit:
        frames:
          base_frame: base_link
          ee_frame: tool0
        groups:
          arm: robot_arm
          gripper: hand
        move_groups:
          fairino: /move_group_fairino
          kdl: /move_group_kdl
        ik:
          default: fairino
        pipeline:
          default: fairino
        planner:
          default: tube_birrt*
        readiness:
          timeout_sec: 10.0
          allow_cross_client_fallback: true
        ik_moveit_servo: kdl
      controllers:
        active: NLADRC
        profiles:
          PID:
            tuning: &id001
              pid_kp_xy: 15.0
              pid_ki_xy: 6.0
              pid_kd_xy: 0.0
              pid_kp_z: 4.0
              pid_ki_z: 0.0
              pid_kd_z: 0.0
              pid_d_ema_alpha: 0.8
              pid_derivative_clip_xy: 1.0
              pid_derivative_clip_z: 1.0
              pid_integral_limit_xy: 0.003
              pid_integral_active_radius: 0.01
              pid_integral_decay: 0.94
              pid_u_xy_max: 0.22
              v_xy_max: 3.2
              a_xy_max: 1.5
              v_z_max: 3.2
              a_z_max: 1.5
              twist_norm_max: 3.0
              status1_speed_scale: 0.4
              predict_lead_sec: 0.055
              max_predict_horizon: 0.12
              servo_detection_timeout: 0.14
              cmd_lpf_alpha: 0.7
              vel_ff_gain: 1.3
              rel_vel_damping_gain: 1.2
              ff_vel_ema_alpha: 0.75
              max_target_speed: 0.075
              target_vxyz_clip: 0.075
              meas_jump_clip_xyz: 0.004
              ee_vel_ema_alpha: 0.7
              rel_vel_clip: 0.075
              ff_term_clip: 0.065
              target_accel_ema_alpha: 0.25
              ff_age_start_sec: 0.08
              ff_age_ref_sec: 0.09
              ff_age_window_sec: 0.05
              ff_age_floor_scale: 0.7
              ff_err_norm_threshold: 0.0065
              ff_large_err_scale: 1.0
              slew_dv_trigger: 0.03
              slew_alpha_high: 1.0
              slew_alpha_low: 0.95
              handoff_target_delta_max: 0.01
              handoff_target_speed_max: 0.005
              servo_handoff_zero_twist_count: 5
          PD:
            tuning: *id001
          PI_FF:
            tuning: *id001
          ADAPTIVE_PID:
            pid_tuning: *id001
            adaptive_tuning:
              adaptive_pid_kp_xy: 50.0
              adaptive_pid_ki_xy: 0.0
              adaptive_pid_kd_xy: 10.0
              adaptive_pid_ki_z: 20.0
              adaptive_pid_schedule_alpha: 0.8
              adaptive_pid_kp_xy_min: 9.0
              adaptive_pid_kp_xy_max: 9.0
              adaptive_pid_kp_z_min: 1.5
              adaptive_pid_kp_z_max: 3.2
