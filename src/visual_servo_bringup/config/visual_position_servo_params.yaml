              ff_age_start_sec: 0.08
              ff_age_ref_sec: 0.09
              ff_age_window_sec: 0.05
              ff_age_floor_scale: 0.7
              ff_err_norm_threshold: 0.0065
              ff_large_err_scale: 0.6
              slew_dv_trigger: 0.03
              slew_alpha_high: 1.0
              slew_alpha_low: 0.7
              handoff_target_delta_max: 0.01
              handoff_target_speed_max: 0.005
              servo_handoff_zero_twist_count: 5
          LADRC:
            tuning:
              ladrc_wc_xy: 10.0
              ladrc_wo_xy: 25.0
              ladrc_b0_xy: 0.5
              ladrc_wc_z: 4.0
              ladrc_wo_z: 15.0
              ladrc_b0_z: 1.0
              ladrc_ff_mix_gain: 0.2
              v_xy_max: 3.2
              a_xy_max: 0.6
              v_z_max: 0.08
