    yolo_kalman:
      backend: tensorrt
      model_path: yolo-obb-640.engine
      engine_path: yolo-obb-640.engine
      device: auto
      imgsz: 640
      conf: 0.5
      rgb_topic: /camera/camera/color/image_raw
      depth_topic: /camera/camera/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
      depth_max_range: 10.0
      stride_elongated_object: 5
      stride_box: 10
      stride_cube: 1
      max_points: 5000
      min_points_elongated_object: 20
      min_points_box: 200
      min_points_cube: 50
      depth_inlier_m: 0.08
      depth_mad_scale: 3.0
      min_depth_inlier_ratio: 0.6
      axis_smoothing_alpha: 0.3
      min_pca_yaw_quality: 0.3
      inference_period: 0.0166
      pose_publish_rate: 60.0
      hold_last_seconds: 0.13
      yaw_smoothing_alpha: 0.3
      xyz_smoothing_alpha: 0.8
      use_kalman_filter: true
      kf_q_pos: 0.0001
      kf_q_vel: 0.003
      kf_r_xyz: 0.02
      kf_max_xyz_jump: 0.025
      kf_q_yaw: 0.001
      kf_q_yaw_rate: 0.05
      kf_r_yaw: 0.003
      max_predict_seconds: 0.04
      max_missed_frames: 6
      sync_queue_size: 10
      sync_slop: 0.015
environments:
  real:
    launch:
      use_sim_time: false
      camera_serial_no: ''
      color_profile: 640x480x60
      depth_profile: 640x480x60
      pointcloud_enable: false
      use_rviz: true
      debug: false
      allow_trajectory_execution: true
      publish_monitored_planning_scene: true
      monitor_dynamics: false
      capabilities: ''
      disable_capabilities: ''
      publish_frequency: 100.0
    nodes:
      visual_servo_grasping:
        task:
          above_offset: 0.2
          home_pose:
            xyz:
            - 0.1
            - 0.3
            - 0.25
            rpy_deg:
            - 0.0
            - -180.0
            - 100.0
        planning:
          target_above_rpy_deg:
          - 0.0
          - -180.0
          - 100.0
        runtime:
          position_servo_rate_hz: 100.0
  sim:
    launch:
      camera:
        camera_profile: d435_color_640x480x60_depth_640x480x60
        camera_noise_mode: 'off'
        camera_fps: 60
        camera_image_width: 640
        camera_image_height: 480
      aruco_motion:
        model_name: aruco_marker_model
        cmd_topic: /model/aruco_marker_model/cmd_vel
        cmd_internal_topic: /aruco_truth/cmd_vel_command_internal
        auto_start_topic: /aruco_marker_auto_start
        trajectory_type: circle
        linear_x: 0.05
        linear_y: 0.0
        angular_z: 0.5
        max_motion_time: 30.0
        publish_rate: 30.0
      use_sim_time: true
      camera_profile_file: ''
      camera_depth_far_m: 10.0
      robot_profile: fairino3_v6  #fairino3_v6/fairino_arm_gripper_onbase
    nodes:
      visual_servo_grasping:
        task:
          above_offset: 0.22
          home_pose:
            xyz:
            - -0.2
            - 0.25
            - 0.25
            rpy_deg:
            - 0.0
            - -180.0
            - 0.0
        planning:
          target_above_rpy_deg:
          - -45.0
          - -180.0
          - 0.0
        runtime:
          position_servo_rate_hz: 250.0
