              v_xy_max: 3.2
              a_xy_max: 0.6
              v_z_max: 0.08
              a_z_max: 3.2
              twist_norm_max: 0.8
              status1_speed_scale: 0.4
              predict_lead_sec: 0.025
              max_predict_horizon: 0.12
              servo_detection_timeout: 0.14
              cmd_lpf_alpha: 0.7
              vel_ff_gain: 0.9
              rel_vel_damping_gain: 1.2
              ff_vel_ema_alpha: 0.65
              max_target_speed: 0.06
              target_vxyz_clip: 0.06
              meas_jump_clip_xyz: 0.004
              ee_vel_ema_alpha: 0.7
              rel_vel_clip: 0.06
              ff_term_clip: 0.05
