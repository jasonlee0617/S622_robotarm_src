/**:
  ros__parameters:
    # MPC controller parameters. Loaded together with visual_servo_params.yaml.

    mpc_ts: 0.005
    mpc_horizon: 16
    mpc_tau: 0.010
    mpc_delay_sec: 0.005
    mpc_delay_steps: 1

    # Cost weights: larger q tracks harder; larger r smooths more.
    mpc_q_e: 320.0
    mpc_q_v: 2.0
    mpc_q_terminal: 480.0
    mpc_r_u: 0.16
    mpc_r_du: 2.0

    # MPC local output limits.
    mpc_u_max: 0.24
    mpc_du_max: 0.018
    mpc_norm_clip: 0.24

    # Shared tracking/feedforward parameters for MPC visual servo.
    v_xy_max: 3.2
    a_xy_max: 0.60
    v_z_max: 0.08
    a_z_max: 3.2
    twist_norm_max: 0.10
    status1_speed_scale: 0.40
    predict_lead_sec: 0.060
    max_predict_horizon: 0.12
    servo_detection_timeout: 0.14
    cmd_lpf_alpha: 0.70
    vel_ff_gain: 1.22
    rel_vel_damping_gain: 0.30
    ff_vel_ema_alpha: 0.75
    max_target_speed: 0.075
    target_vxy_clip: 0.075
    meas_jump_clip_xy: 0.004
    ee_vel_ema_alpha: 0.70
    rel_vel_clip: 0.05
    ff_term_clip: 0.075
    target_accel_ema_alpha: 0.25
    ff_age_start_sec: 0.08
    ff_age_ref_sec: 0.09
    ff_age_window_sec: 0.05
    ff_age_floor_scale: 0.70
    ff_err_norm_threshold: 0.0065
    ff_large_err_scale: 1.00
    slew_dv_trigger: 0.03
    slew_alpha_high: 1.00
    slew_alpha_low: 0.70
    handoff_target_delta_max: 0.01
    servo_handoff_zero_twist_count: 5
