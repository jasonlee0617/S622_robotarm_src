gazebo:
  camera:
    camera_profile: d435_color_640x480x60_depth_640x480x60
    camera_noise_mode: "off"
    camera_fps: 60
    camera_image_width: 640
    camera_image_height: 480

nodes:
  visual_servo_grasping:
    task:
      preferred_target: cube
      place_offset: 0.10
      above_offset: 0.12
      grasp_offset: 0.015
      home_joints: [-1.1170, -1.6214, 1.5465, -1.5877, -1.6368, 0.0]
      action_delay: 0.5
      detection_timeout: 3.0
      num_candidate_plans: 5
      wrist_weight: 50.0
      wrist_joint_indices: [2, 3, 4]
      grasp:
        elongated_object:
          roll: 0.0
          pitch: -180.0
          yaw_offset: -180.0
        cube:
          roll: 0.0
          pitch: -180.0
          yaw_offset: 0.0
    moveit:
      arm_group_name: robot_arm
      hand_group_name: hand
      base_frame: base_link
      camera_frame: camera_color_optical_frame
      ee_frame: tool0
      planning_pipeline_id: fairino
      planner_id: tube_birrt*
      move_group_ns_fairino: /move_group_fairino
      move_group_ns_kdl: /move_group_kdl
      ik_plugin: fairino
      allow_cross_client_fallback: true
      move_group_ready_timeout_sec: 10.0
      arm_max_velocity: 0.3
      arm_max_acceleration: 0.3
      allowed_planning_time: 15.0
      position_tolerance: 0.005
      orientation_tolerance: 0.005
      allowed_start_tolerance: 0.1
      j2_constraint_position: -1.5708
      j2_constraint_tolerance: 1.5708
    runtime:
      servo_ns: /servo_node
      servo_qos_mode: modern
      servo_qos_cmd_reliability: reliable
      servo_qos_cmd_durability: volatile
      servo_qos_cmd_depth: 1
      servo_qos_status_reliability: reliable
      servo_qos_status_durability: volatile
      servo_qos_status_depth: 1
      servo_align_xyz_tol: 0.001
      servo_status_decel_codes: [1, 6]
      servo_status_halt_codes: [2, 4, 5]
      aligned_stable_count: 80
    controllers:
      active: NLADRC
      profiles:
        PID:
          tuning: &pid_tuning
            pid_kp_xy: 15.0
            pid_ki_xy: 6.0
            pid_kd_xy: 0.0
            pid_kp_z: 4.0
            pid_ki_z: 0.0
            pid_kd_z: 0.0
            pid_d_ema_alpha: 0.8
            pid_derivative_clip_xy: 1.0
            pid_derivative_clip_z: 1.0
            pid_integral_limit_xy: 0.003
            pid_integral_active_radius: 0.010
            pid_integral_decay: 0.94
            pid_u_xy_max: 0.22
            v_xy_max: 3.2
            a_xy_max: 1.50
            v_z_max: 0.08
            a_z_max: 3.2
            twist_norm_max: 0.10
            status1_speed_scale: 0.40
            predict_lead_sec: 0.055
            max_predict_horizon: 0.12
            servo_detection_timeout: 0.14
            cmd_lpf_alpha: 0.70
            vel_ff_gain: 1.30
            rel_vel_damping_gain: 1.20
            ff_vel_ema_alpha: 0.75
            max_target_speed: 0.075
            target_vxyz_clip: 0.075
            meas_jump_clip_xyz: 0.004
            ee_vel_ema_alpha: 0.70
            rel_vel_clip: 0.075
            ff_term_clip: 0.065
            target_accel_ema_alpha: 0.25
            ff_age_start_sec: 0.08
            ff_age_ref_sec: 0.09
            ff_age_window_sec: 0.05
            ff_age_floor_scale: 0.70
            ff_err_norm_threshold: 0.0065
            ff_large_err_scale: 1.00
            slew_dv_trigger: 0.03
            slew_alpha_high: 1.00
            slew_alpha_low: 0.95
            handoff_target_delta_max: 0.01
            handoff_target_speed_max: 0.005
            servo_handoff_zero_twist_count: 5
        PD:
          tuning: *pid_tuning
        PI_FF:
          tuning: *pid_tuning
        ADAPTIVE_PID:
          pid_tuning: *pid_tuning
          adaptive_tuning:
            adaptive_pid_kp_xy: 50.0
            adaptive_pid_ki_xy: 0.0
            adaptive_pid_kd_xy: 10.0
