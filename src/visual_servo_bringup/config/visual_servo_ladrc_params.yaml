/**:
  ros__parameters:
    # LADRC controller parameters. Loaded together with visual_servo_params.yaml.

    # XY 控制/观测器带宽。wc 决定响应速度，wo 决定扰动估计速度。
    ladrc_wc_xy: 10.0
    ladrc_wo_xy: 25.0
    ladrc_b0_xy: 0.5

    # Z 向 LADRC 参数。
    ladrc_wc_z: 4.0
    ladrc_wo_z: 15.0
    ladrc_b0_z: 1.0

    # LADRC 分支中前馈混合比例；过大容易放大速度估计噪声。
    ladrc_ff_mix_gain: 0.20

    # Shared tracking/feedforward parameters for LADRC visual servo.
    v_xy_max: 3.2
    a_xy_max: 0.60
    v_z_max: 0.08
    a_z_max: 3.2
    twist_norm_max: 0.10
    status1_speed_scale: 0.40
    predict_lead_sec: 0.025
    max_predict_horizon: 0.12
    servo_detection_timeout: 0.14
    cmd_lpf_alpha: 0.70
    vel_ff_gain: 0.9
    rel_vel_damping_gain: 1.20
    ff_vel_ema_alpha: 0.65
    max_target_speed: 0.06
    target_vxy_clip: 0.06
    meas_jump_clip_xy: 0.004
    ee_vel_ema_alpha: 0.70
    rel_vel_clip: 0.06
    ff_term_clip: 0.05
    target_accel_ema_alpha: 0.25
    ff_age_start_sec: 0.08
    ff_age_ref_sec: 0.09
    ff_age_window_sec: 0.05
    ff_age_floor_scale: 0.70
    ff_err_norm_threshold: 0.0065
    ff_large_err_scale: 0.60
    slew_dv_trigger: 0.03
    slew_alpha_high: 1.00
    slew_alpha_low: 0.70
    handoff_target_delta_max: 0.01
    servo_handoff_zero_twist_count: 5
