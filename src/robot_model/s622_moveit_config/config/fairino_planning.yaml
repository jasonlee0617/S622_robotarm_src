planning_plugin: fairino_planning/FairinoPlannerManager

# The Fairino pipeline exports collision-validated fixed-dt waypoints.  The
# time-optimal adapter resamples that geometry after validation and can create
# an unchecked collision, so leave timing to the exported controller points.
request_adapters: >-
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

response_adapters: ""


max_iterations: 12000
max_step: 0.20
goal_threshold: 0.08
goal_bias: 0.20
prob_tube: 0.20
sigma_local: 0.4363
max_ik_tries: 2
gamma: 1.5
max_rewire_radius: 0.25
max_near: 20
continue_after_goal: true
rewire_after_goal_iters: 200
goal_connect_every_k: 5
tube_every_k: 8
tube_cooldown_len: 20
tube_fail_streak_to_cool: 4
kd_rebuild_every: 600
prob_uniform: 0.12
tube_radius: 0.18
validation_distance: 0.10
connect_max_steps: 15
connect_goal_bias: 0.12
rewire_every_k: 3
rewire_max_neighbors: 5

sampling:
  adaptive_progress_nodes: 500.0
  adaptive_goal_bias_min: 0.05
  adaptive_goal_bias_gain: 0.20
  adaptive_tube_prob_min: 0.05
  adaptive_tube_prob_initial: 0.25
  adaptive_local_sigma_base: 1.5
  adaptive_local_sigma_decay: 0.8
  detour_min_height: 0.15
  detour_vertical_clearance: 0.12
  detour_min_side_dist: 0.15
  detour_side_scale: 0.7
  detour_side_z_offset: 0.05
  detour_projection_eps: 0.001
  detour_side_fallback_dist: 0.20
  far_rpy_offsets_deg:
    [0.0, 0.0, 0.0,
     0.0, 20.0, 0.0,
     0.0, -20.0, 0.0,
     20.0, 0.0, 0.0,
     -20.0, 0.0, 0.0,
     0.0, 0.0, 20.0,
     0.0, 0.0, -20.0,
     0.0, 40.0, 0.0,
     0.0, -40.0, 0.0]
  tube_detour_over_threshold: 0.35
  tube_detour_side_threshold: 0.70
  tube_segment_switch_prob: 0.50
  far_orientation_candidate_count: 2
  ik_seed_perturb_sigma: 0.20
  uniform_retry_count: 3
  local_retry_levels: 3
  farthest_sample_count: 4
  local_direction_step_scale: 1.5
  local_gaussian_sigma: 0.40
  fallback_uniform_retries: 5

termination:
  stale_improve_break_iters: 100
  min_iters_after_goal_before_stale_break: 50
  connect_success_every_k: 3
  connect_success_dist_scale: 1.5
  direct_connect_step_factor: 1.5
  connect_target_tolerance: 0.02

orientation:
  near_dist: 0.12
  ori_gate_dist: 0.12
  ori_far_tol_deg: 180.0
  ori_near_tol_deg: 1.0
  ori_weight_far: 0.0
  ori_weight_near: 1.0

fallback:
  levels: [1.0, 0.12, 0.12, 3.0, 0.15, 0.15, 5.0, 0.20, 0.20, 10.0, 0.25, 0.25]

optimizer:
  validation_distance: 0.05
  shortcut_trials: 200
  pull_trials: 100
  densify_max_spacing: 0.05
  pull_alpha_min: 0.10
  pull_alpha_max: 0.90
  orientation_check_count: 5

trajectory:
  waypoint_dt: 0.08

pipeline:
  default_obstacle_origin: [0.0, 0.30, 0.10]
  default_obstacle_size: [0.30, 0.05, 0.20]

# IK / Jacobian gate parameters used by fairino_planning_ros::FairinoPlannerManager
fairino:
  ik:
    W_move_diag: [5.0, 2.5, 2.0, 1.5, 1.0, 1.0]

    # IK candidate scoring
    w_move: 3.0
    w_limit: 15.0
    w_sing: 2.0
    w_wrist: 150.0
    w_task: 250.0

    # Hard filters
    sigma_min_threshold: 0.001
    sigma_hard_flange: 0.03
    sigma_hard_gripper: 0.03
    sigma_soft_ref: 0.05
    cond_soft_ref: 120.0
    cond_hard_max: 400.0
    wrist_sin_min: 0.12
    elbow_sin_min: 0.08
    base_radius_min: 0.03
    joint_margin_hard_rad: 0.08
    branch_switch_penalty: 1.0
    branch_motion_penalty: 0.05
    lexicographic_eps: 0.0001
    penalty_q2_positive: 2.0
    penalty_q4_positive: 3.0
    penalty_q5_ref: 0.2
    q5_ref: 1.5708
    elbow_height_gain: 1.0
    enable_task_cost: true
    reject_q2_positive: false
    reject_q4_positive: false
