planning_plugin: ompl_interface/OMPLPlanner

request_adapters: >-
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
  default_planner_request_adapters/AddTimeOptimalParameterization

start_state_max_bounds_error: 0.05

planner_configs:
  # ========= 推荐主规划器：RRTConnect =========
  RRTConnectFast:
    type: geometric::RRTConnect
    range: 0.25    # 关键参数：扩展步长（单位是 OMPL state-space 距离尺度，工程上 0.15~0.35 常用）
    'max_step_size': 0.25,  # 设定较小的步长

  # ========= 备用：KPIECE（复杂障碍有时更稳） =========
  KPIECE:
    type: geometric::KPIECE
    range: 0.20
    goal_bias: 0.05
    border_fraction: 0.9
    min_valid_path_fraction: 0.5

  # ========= 备用：PRM（如果你经常重复规划同类场景） =========
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 15

  # ========= 可选：RRTstar（如果你更关心路径质量而非速度） =========
  RRTstar:
    type: geometric::RRTstar
    range: 0.20
    goal_bias: 0.25
    delay_collision_checking: 1
   

robot_arm:
  planner_configs:
    - RRTConnectFast
    - KPIECE
    - PRM
    - RRTstar
robot_arm_tip:
  planner_configs:
    - RRTConnectFast
    - KPIECE
    - PRM
    - RRTstar
#RRT：经典快速随机树，速度快，路径质量一般。
# RRTConnect：双向 RRT（从起点和终点同时扩展并尝试连接），MoveIt 默认最常用，速度很快、成功率高。
# RRT*：渐进最优，会越来越优化路径，但通常更慢。
# TRRT / BiTRRT / LBTRRT：把“代价”（比如离障碍、能量等）纳入采样扩展，能得到更“好”的路径，但参数更敏感、速度可能慢。
# 常见参数：
# range：一次扩展的最大步长（很重要！）
# 太大：容易撞障碍、规划失败或路径“抖”
# 太小：规划慢
# goal_bias：以一定概率直接朝目标采样（越大越“冲目标”，但可能卡在障碍旁）