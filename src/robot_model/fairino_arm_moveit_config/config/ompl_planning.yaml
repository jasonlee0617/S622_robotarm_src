planning_plugin: ompl_interface/OMPLPlanner

request_adapters: >-
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
  default_planner_request_adapters/AddTimeOptimalParameterization

start_state_max_bounds_error: 0.05
longest_valid_segment_fraction: 0.005

planner_configs:
  # 主力快速规划器。双向扩展，速度和成功率通常最好。
  RRTConnectFast:
    type: geometric::RRTConnect
    range: 0.25

  # 标准 RRTConnect。保留较保守步长，便于和 Fast 对比。
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.20

  # MoveIt/OMPL 旧默认命名兼容项。
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.20

  # 单树 RRT。速度快，路径质量一般，适合快速可达性检查。
  RRT:
    type: geometric::RRT
    range: 0.20
    goal_bias: 0.05

  # 渐进最优 RRT。更关注路径质量，通常比 RRTConnect 慢。
  RRTstar:
    type: geometric::RRTstar
    range: 0.20
    goal_bias: 0.05
    delay_collision_checking: 1

  # Transition-based RRT。会考虑路径代价，参数更敏感。
  TRRT:
    type: geometric::TRRT
    range: 0.15
    goal_bias: 0.05
    max_states_failed: 10
    temp_change_factor: 2.0
    min_temperature: 1.0e-10
    init_temperature: 1.0e-6
    frountier_threshold: 0.0
    frountierNodeRatio: 0.1
    k_constant: 0.0

  # 双向 TRRT。复杂约束下可尝试，规划时间通常更长。
  BiTRRT:
    type: geometric::BiTRRT
    range: 0.15
    temp_change_factor: 0.1
    init_temperature: 100
    frountier_threshold: 0.0
    frountier_node_ratio: 0.1
    cost_threshold: 1.0e300

  # Lower-bound TRRT。质量导向，比普通 RRTConnect 更慢。
  LBTRRT:
    type: geometric::LBTRRT
    range: 0.15
    goal_bias: 0.05
    epsilon: 0.4

  # Single-query bidirectional lazy planner。碰撞检测延迟，适合高维空间。
  SBL:
    type: geometric::SBL
    range: 0.20

  # Expansive Space Trees。狭窄通道场景可尝试。
  EST:
    type: geometric::EST
    range: 0.20
    goal_bias: 0.05

  # 双向 EST。比 EST 更适合起点/终点双向连接。
  BiEST:
    type: geometric::BiEST
    range: 0.20

  # Projection EST。依赖状态投影，适合有良好投影的空间。
  ProjEST:
    type: geometric::ProjEST
    range: 0.20
    goal_bias: 0.05

  # KPIECE。基于投影网格探索，复杂障碍有时比 RRTConnect 稳。
  KPIECE:
    type: geometric::KPIECE
    range: 0.20
    goal_bias: 0.05
    border_fraction: 0.9
    failed_expansion_score_factor: 0.5
    min_valid_path_fraction: 0.5

  # 双向 KPIECE。起点/终点同时扩展。
  BKPIECE:
    type: geometric::BKPIECE
    range: 0.20
    border_fraction: 0.9
    failed_expansion_score_factor: 0.5
    min_valid_path_fraction: 0.5

  # Lazy bounded KPIECE。更少碰撞检测，适合碰撞检测开销大的场景。
  LBKPIECE:
    type: geometric::LBKPIECE
    range: 0.20
    border_fraction: 0.9
    min_valid_path_fraction: 0.5

  # PRM。多查询场景可复用路线图，单次规划不一定比 RRTConnect 快。
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 15

  # 渐进最优 PRM。更关注路径质量。
  PRMstar:
    type: geometric::PRMstar

  # Lazy PRM。延迟碰撞检测，碰撞检测昂贵时可尝试。
  LazyPRM:
    type: geometric::LazyPRM
    range: 0.20

  # 渐进最优 Lazy PRM。
  LazyPRMstar:
    type: geometric::LazyPRMstar

  # Fast Marching Tree。批采样规划器，适合离线或较宽裕时间预算。
  FMT:
    type: geometric::FMT
    num_samples: 1000
    radius_multiplier: 1.1
    nearest_k: 1
    cache_cc: 1
    heuristics: 0
    extended_fmt: 1

  # Bidirectional FMT。双向批采样。
  BFMT:
    type: geometric::BFMT
    num_samples: 1000
    radius_multiplier: 1.0
    nearest_k: 1
    balanced: 0
    optimality: 1
    heuristics: 1
    cache_cc: 1
    extended_fmt: 1

  # PDST。二叉空间分解，适合部分高维问题。
  PDST:
    type: geometric::PDST

  # STRIDE。GNAT nearest-neighbor 结构，适合高维探索。
  STRIDE:
    type: geometric::STRIDE
    range: 0.20
    goal_bias: 0.05
    use_projected_distance: 0
    degree: 16
    max_degree: 18
    min_degree: 12
    max_pts_per_leaf: 6
    estimated_dimension: 0.0
    min_valid_path_fraction: 0.2

  # SPARS。稀疏 roadmap，适合多次查询和路径质量约束。
  SPARS:
    type: geometric::SPARS
    stretch_factor: 3.0
    sparse_delta_fraction: 0.25
    dense_delta_fraction: 0.001
    max_failures: 1000

  # SPARS2。SPARS 改进版，通常质量更好但更慢。
  SPARStwo:
    type: geometric::SPARStwo
    stretch_factor: 3.0
    sparse_delta_fraction: 0.25
    dense_delta_fraction: 0.001
    max_failures: 5000

robot_arm:
  default_planner_config: RRTConnectFast
  planner_configs:
    - RRTConnectFast
    - RRTConnect
    - RRTConnectkConfigDefault
    - RRT
    - RRTstar
    - TRRT
    - BiTRRT
    - LBTRRT
    - SBL
    - EST
    - BiEST
    - ProjEST
    - KPIECE
    - BKPIECE
    - LBKPIECE
    - PRM
    - PRMstar
    - LazyPRM
    - LazyPRMstar
    - FMT
    - BFMT
    - PDST
    - STRIDE
    - SPARS
    - SPARStwo
