# ── 全局默认设置（修改此处即可切换模式/相机，无需每次输 :=）──
settings:
  calibration_type: eye_in_hand   # eye_on_base | eye_in_hand
  camera_type: realsense          # realsense | oak

profiles:
  eye_on_base:
    calibration_name: robot_calibration
    calibration_type: eye_on_base
    robot_base_frame: base_link
    robot_effector_frame: calibration_marker
    tracking_base_frame: camera_color_optical_frame
    tracking_marker_frame: calibration_aruco
    marker_id: 1
    camera_link_frame: camera_link
    camera_optical_frame: camera_color_optical_frame
    publish_camera_link_frame: camera_link
    use_tracking_to_camera_link_compensation: true
    rviz_config: moveit_with_camera.rviz

  eye_in_hand:
    calibration_name: robot_calibration
    calibration_type: eye_in_hand
    robot_base_frame: base_link
    robot_effector_frame: grasp_frame
    tracking_base_frame: camera_color_optical_frame
    tracking_marker_frame: calibration_aruco
    marker_id: 1
    camera_link_frame: camera_link
    camera_optical_frame: camera_color_optical_frame
    publish_camera_link_frame: camera_link
    use_tracking_to_camera_link_compensation: true
    rviz_config: moveit_with_camera.rviz
