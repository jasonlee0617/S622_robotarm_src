fairino:
  algorithms:
    aapf_birrt_star:
      max_iterations: 3000
      max_step: 0.20
      goal_threshold: 0.08
      goal_bias: 0.20
      prob_tube: 0.20
      sigma_local: 0.4363
      max_ik_tries: 2
      gamma: 1.5
      max_rewire_radius: 0.25
      max_near: 20
      continue_after_goal: false
      rewire_after_goal_iters: 50
      goal_connect_every_k: 2
      tube_every_k: 8
      tube_cooldown_len: 20
      tube_fail_streak_to_cool: 4
      kd_rebuild_every: 600
      prob_uniform: 0.12
      tube_radius: 0.18
      validation_distance: 0.05

      connect_max_steps: 20
      connect_goal_bias: 0.12
      rewire_every_k: 3
      rewire_max_neighbors: 5

      sampling:
        adaptive_progress_nodes: 500.0
        adaptive_goal_bias_min: 0.05
        adaptive_goal_bias_gain: 0.20
        adaptive_tube_prob_min: 0.05
        adaptive_tube_prob_initial: 0.25
        adaptive_local_sigma_base: 1.5
        adaptive_local_sigma_decay: 0.8
        detour_min_height: 0.15
        detour_vertical_clearance: 0.12
        detour_min_side_dist: 0.15
        detour_side_scale: 0.7
        detour_side_z_offset: 0.05
        detour_projection_eps: 0.001
        detour_side_fallback_dist: 0.20
        far_rpy_offsets_deg:
          [0.0, 0.0, 0.0,
           0.0, 20.0, 0.0,
           0.0, -20.0, 0.0,
           20.0, 0.0, 0.0,
           -20.0, 0.0, 0.0,
           0.0, 0.0, 20.0,
           0.0, 0.0, -20.0,
           0.0, 40.0, 0.0,
           0.0, -40.0, 0.0]
        tube_detour_over_threshold: 0.35
        tube_detour_side_threshold: 0.70
        tube_segment_switch_prob: 0.50
        far_orientation_candidate_count: 2
        ik_seed_perturb_sigma: 0.20
        uniform_retry_count: 3
        local_retry_levels: 3
        farthest_sample_count: 4
        local_direction_step_scale: 1.5
        local_gaussian_sigma: 0.40
        fallback_uniform_retries: 5

      aapf:
        enable: true
        ka: 1.2
        kr: 2.0
        repulsion_range_m: 0.24
        goal_bias_p0: 0.10
        goal_bias_beta: 0.45
        alpha0: 0.28
        beta0: 0.52
        gamma0: 0.28
        density_radius_m: 0.12
        density_samples: 24
        trap_threshold_iters: 120
        trap_grace_iters: 120
        step_min_m: 0.020
        step_max_m: 0.075
        risk_radius_m: 0.06
        transition_radius_m: 0.14
        obstacle_inflation_m: 0.04
        sobol_workspace_padding_m: 0.20
        density_attraction_rho: 0.35
        density_repulsion_rho: 0.45
        beta_epsilon: 0.05
        gamma_mu: 0.05
        max_guided_ik_tries: 2
        log_every_n_iters: 200
        warm_start_no_connection_ms: 350
        rescue_start_s: 1.25
        goal_approach_shells_m: [0.08, 0.14, 0.20]
        goal_approach_max_targets: 10
        hard_deadline_ms: 1850
        strict_validation_distance: 0.015
        goal_approach_per_goal_max: 8
        warm_start_search_reserve_ms: 1000
        warm_start_connection_reserve_ms: 200
        warm_start_connection_ms: 1100
        warm_start_direct_goal_period: 5
        warm_start_target_boost_period: 4
        warm_start_target_connect_regular: 1
        warm_start_target_connect_boost: 2
        warm_start_post_goal_try_limit: 80
        warm_start_stale_improve_try_limit: 24
        near_goal_snap_thresh_m: 0.30
        near_goal_connect_thresh_m: 0.28
        recovery_path_cost_factor: 3.0
        recovery_path_cost_min_steps: 20.0
        stagnation_check_every: 50
        pre_goal_window_iters: 400
        connect_window_iters: 200
        recovery_iterations: 150
        max_stagnation_recoveries: 1
        goal_side_recovery_iterations: 220
        stagnation_goal_dist_threshold_m: 0.01
        connect_stagnation_goal_dist_threshold_m: 0.005
        tree_imbalance_ratio: 6.0
        collision_cooldown_window_iters: 100
        collision_reject_threshold: 55
        collision_guided_cooldown_iters: 20
        guided_window_iters: 40
        guided_attempts_min: 12
        guided_success_min_ratio: 0.20
        guided_low_success_cooldown_iters: 60
        goal_side_pressure_snap_tries: 8
        goal_side_pressure_connect_tries: 50
        goal_side_pressure_start_iter: 100
        goal_side_growth_skip_mod: 3
        near_goal_snap_fail_tries: 20
        near_goal_connect_fail_tries: 10
        connect_stagnation_min_iter: 600
        connect_stagnation_min_tries: 25
        approach_target_period: 2
        periodic_connect_force_mod: 8
        recovery_deadline_reserve_ms: 100
        rescue_target_connect_max: 8
        warm_followup_target_connect_max: 4
        regular_target_connect_max: 3
        goal_snap_bridge_scales: [0.5, 0.35, 0.65]
        cartesian_snap_step_m: 0.055
        cartesian_snap_top_clearance_m: 0.08
        cartesian_snap_side_offset_m: 0.16
        cartesian_snap_z_lift_m: 0.04

      termination:
        stale_improve_break_iters: 60
        min_iters_after_goal_before_stale_break: 20
        connect_success_every_k: 2
        connect_success_dist_scale: 1.8
        direct_connect_step_factor: 2.0
        connect_target_tolerance: 0.04

      orientation:
        near_dist: 0.12
        ori_gate_dist: 0.12
        ori_far_tol_deg: 180.0
        ori_near_tol_deg: 1.0
        ori_weight_far: 0.0
        ori_weight_near: 1.0

      fallback:
        levels: [1.0, 0.12, 0.12, 3.0, 0.15, 0.15, 5.0, 0.20, 0.20, 10.0, 0.25, 0.25]
