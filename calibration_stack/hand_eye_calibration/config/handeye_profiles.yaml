# =============================================================================
# handeye_profiles.yaml – 手眼标定配置文件
# 定义全局设置（settings）和不同标定模式的参数集（profiles）。
# =============================================================================

# ── 全局默认设置（修改此处即可切换模式/相机，无需每次输 :=）──
settings:
  calibration_type: eye_in_hand   # 默认标定模式：eye_on_base（眼在手外）| eye_in_hand（眼在手上）
  camera_type: realsense          # 默认相机类型：realsense | oak

# ── 标定模式配置集 ──
profiles:
  # ------------------------------------------------------------------
  # 眼在手外（eye_on_base）标定模式
  # 相机固定安装在外部，机器人末端夹持标定标记（calibration_aruco）。
  # ------------------------------------------------------------------
  eye_on_base:
    calibration_name: robot_calibration                    # 标定任务名称（easy_handeye2 内部标识）
    calibration_type: eye_on_base                          # 标定类型（与配置集名称一致）
    robot_base_frame: base_link                           # 机器人基座坐标系
    robot_effector_frame: calibration_marker               # 机器人末端坐标系（携带标定标记）
    tracking_base_frame: camera_color_optical_frame        # 相机光心坐标系（用于跟踪标记）
    tracking_marker_frame: calibration_aruco               # 被跟踪的 ArUco 标记坐标系
    marker_id: 1                                           # 使用的 ArUco 标记 ID
    camera_link_frame: camera_link                         # 相机物理连杆坐标系（通常为相机底座）
    camera_optical_frame: camera_color_optical_frame       # 相机光学坐标系（光心，通常与 tracking_base 一致）
    publish_camera_link_frame: camera_link                 # 发布手眼 TF 时使用的子坐标系名称
    use_tracking_to_camera_link_compensation: true         # 是否启用 tracking -> camera_link 的固定 TF 补偿
    rviz_config: moveit_with_camera.rviz                   # 使用的 RViz 配置文件名称

  # ------------------------------------------------------------------
  # 眼在手上（eye_in_hand）标定模式
  # 相机固定在机器人末端（grasp_frame），外部放置标定标记（calibration_aruco）。
  # ------------------------------------------------------------------
  eye_in_hand:
    calibration_name: robot_calibration                    # 标定任务名称
    calibration_type: eye_in_hand                          # 标定类型
    robot_base_frame: base_link                           # 机器人基座坐标系
    robot_effector_frame: grasp_frame                      # 机器人末端坐标系（相机安装在此）
    tracking_base_frame: camera_color_optical_frame        # 相机光心坐标系（末端相机的光心）
    tracking_marker_frame: calibration_aruco               # 被跟踪的外部 ArUco 标记坐标系
    marker_id: 1                                           # 使用的 ArUco 标记 ID
    camera_link_frame: camera_link                         # 相机物理连杆坐标系
    camera_optical_frame: camera_color_optical_frame       # 相机光学坐标系
    publish_camera_link_frame: camera_link                 # 发布手眼 TF 时使用的子坐标系名称
    use_tracking_to_camera_link_compensation: true         # 是否启用 tracking -> camera_link 的固定 TF 补偿
    rviz_config: moveit_with_camera.rviz                   # 使用的 RViz 配置文件名称