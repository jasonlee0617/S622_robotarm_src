/**:
  ros__parameters:
    # PID / PD / PI_FF shared parameters. PI_FF currently has no extra keys.

    pid_kp_xy: 10.0
    pid_ki_xy: 20.0
    pid_kd_xy: 0.0
    pid_kp_z: 0.0
    pid_ki_z: 0.0
    pid_kd_z: 0.0

    # Derivative and integral guards.
    pid_d_ema_alpha: 0.8
    pid_derivative_clip_xy: 1.0
    pid_derivative_clip_z: 1.0
    pid_integral_limit_xy: 0.005
    pid_integral_active_radius: 0.005
    pid_integral_decay: 0.97

    # PID-family local XY output limit.
    pid_u_xy_max: 0.22

    # Shared tracking/feedforward parameters for PID-family visual servo.
    v_xy_max: 3.2
    a_xy_max: 0.60
    v_z_max: 0.08
    a_z_max: 3.2
    twist_norm_max: 0.10
    status1_speed_scale: 0.40
    predict_lead_sec: 0.025
    max_predict_horizon: 0.12
    servo_detection_timeout: 0.14
    cmd_lpf_alpha: 0.70
    vel_ff_gain: 0.9
    rel_vel_damping_gain: 1.20
    ff_vel_ema_alpha: 0.65
    max_target_speed: 0.06
    target_vxy_clip: 0.06
    meas_jump_clip_xy: 0.004
    ee_vel_ema_alpha: 0.70
    rel_vel_clip: 0.06
    ff_term_clip: 0.05
    target_accel_ema_alpha: 0.25
    ff_age_start_sec: 0.08
    ff_age_ref_sec: 0.09
    ff_age_window_sec: 0.05
    ff_age_floor_scale: 0.70
    ff_err_norm_threshold: 0.0065
    ff_large_err_scale: 0.60
    slew_dv_trigger: 0.03
    slew_alpha_high: 1.00
    slew_alpha_low: 0.70
    handoff_target_delta_max: 0.01
    servo_handoff_zero_twist_count: 5
