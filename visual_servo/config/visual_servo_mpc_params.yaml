/**:
  ros__parameters:
    # MPC controller parameters. Loaded together with visual_servo_params.yaml.

    mpc_ts: 0.005
    mpc_horizon: 32
    mpc_tau: 0.015
    mpc_delay_sec: 0.015
    mpc_delay_steps: 4

    # Cost weights: larger q tracks harder; larger r smooths more.
    mpc_q_e: 160.0
    mpc_q_v: 10.0
    mpc_q_terminal: 200.0
    mpc_r_u: 0.8
    mpc_r_du: 12.0

    # MPC local output limits.
    mpc_u_max: 0.20
    mpc_du_max: 0.0045
    mpc_norm_clip: 0.20
